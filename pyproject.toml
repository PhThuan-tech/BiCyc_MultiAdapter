[build-system]
requires = ["setuptools>=75.6,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "bicyc-multiadapter"
version = "0.1.0"
description = "Exemplar-Free Class-Incremental Learning with KeepLoRA and BiCyc Multi-Adapter"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "BiCyc Multi-Adapter contributors"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
