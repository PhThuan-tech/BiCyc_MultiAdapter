[build-system]
requires = ["setuptools>=75.6,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "bicyc-multiadapter"
version = "0.1.0"
description = "Research scaffold for exemplar-free CIL with KeepLoRA and RSIAT"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "BiCyc Multi-Adapter contributors"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
