name: keeplora_bicyc
method: keeplora_bicyc
seed: 2024
trainer: keeplora
resume: true                 # tá»± Ä‘á»™ng tiáº¿p tá»¥c tá»« checkpoint trong output_dir náº¿u cÃ³
checkpoint_every_epochs: 0   # >0: lÆ°u snapshot giá»¯a task má»—i N epoch (khuyáº¿n nghá»‹ trÃªn cloud)
keep_task_checkpoints: false # true: giữ riêng checkpoint_task_<t>.pt sau mỗi task (tốn ~350MB/task)
defaults:
  - /model: keeplora
  - /data: cifar100_10tasks
  - _self_
image_size: 224
# Transformer projections replaced by KeepLoRA-wrapped linears.
targets: [qkv, proj, fc1, fc2]
activation_cache_rows: 4096  # CPU rows kept per layer for the end-of-task SVD
train:
  epochs_per_task: 20
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  amp: true               # fp16 mixed precision: tăng tốc ~1.8-2x trên GPU TensorCore (T4/RTX/A100)
  amp_dtype: float16      # hoặc bfloat16 (Ampere+)
  phase_stability_start: 0.35
  phase_stability_min: 0.75
  phase_stability_max: 1.0
alignment:
  # BiCyc defaults from the paper; adaptive_distribution is this project's proposal.
  enabled: true           # false => KeepLoRA-only baseline (ablation 1)
  adaptive_gate: true     # false => lambda_t pinned to 1 (ablations 2-3)
  channelwise_gate: true  # true => vector lambda_t [feature_dim] channel-wise weighting
  lambda_bi: 8.0
  lambda_cyc: 2.0
  lambda_iso: 0.1         # isometric regularization for map A to prevent compound drift
  anti_collapse_weight: 0.0
  distribution_metric: symmetric_diagonal_gaussian_kl
  distribution_temperature: 1.0
  lambda_min: 0.4
  lambda_max: 1.0
  alignment_lr: 0.001
keeplora:
  weight_energy: 0.95
  feature_energy: 0.95
  gradient_init_loss: classification_only
  # Original KeepLoRA merges; the hybrid keeps frozen blocks for PFD routing.
  merge_after_task: false
  adapter_strategy: routed_multi_adapter
  router_similarity: cosine # cosine / l2 / dot
  router_temperature: 0.1
  router_top_k: 1
classifier:
  covariance_mode: full_shared  # or diagonal
  shrinkage: 0.0001

