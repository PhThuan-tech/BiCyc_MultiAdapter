name: keeplora_original_8gb
# Original KeepLoRA baseline (merge after task, no distillation) tuned for 8 GB VRAM.
method: keeplora_original
seed: 2024
trainer: keeplora
resume: true                 # tự động tiếp tục từ checkpoint trong output_dir nếu có
checkpoint_every_epochs: 1   # GPU cloud hay hết thời gian: lưu mỗi epoch (file ~350MB, ghi đè)
defaults:
  - /model: keeplora
  - /data: cifar100_10tasks
  - _self_
image_size: 224
targets: [qkv, proj, fc1, fc2]
activation_cache_rows: 1536
train:
  epochs_per_task: 20
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  amp: true               # fp16 giúp GPU 8 GB (RTX 4060...) nhanh hơn đáng kể
  amp_dtype: float16
alignment:
  enabled: false
  adaptive_gate: false
  lambda_bi: 5.0
  lambda_cyc: 1.0
  anti_collapse_weight: 0.0
  distribution_metric: symmetric_diagonal_gaussian_kl
  distribution_temperature: 1.0
  lambda_min: 0.1
  lambda_max: 1.0
  alignment_lr: 0.001
keeplora:
  weight_energy: 0.95
  feature_energy: 0.95
  gradient_init_loss: classification_only
  merge_after_task: true
  adapter_strategy: merge
  router_similarity: l2
  router_temperature: 1.0
  router_top_k: null
classifier:
  covariance_mode: full_shared
  shrinkage: 0.0001