name: keeplora_bicyc_8gb
# Full proposed method tuned for small GPUs (8 GB laptop / 16 GB T4-P100):
# smaller batch and activation cache so backbone + old snapshot + BiCyc fit in VRAM.
method: keeplora_bicyc
seed: 2024
trainer: keeplora
resume: true                 # auto-continue from checkpoints inside output_dir
checkpoint_every_epochs: 1   # cloud sessions get cut: save every epoch (~350MB, overwritten)
keep_task_checkpoints: false # true: keep checkpoint_task_<t>.pt after each task (~350MB each)
defaults:
  - /model: keeplora
  - /data: cifar100_10tasks
  - _self_
image_size: 224
targets: [qkv, proj, fc1, fc2]
activation_cache_rows: 1536  # ~220 MB CPU RAM per layer budget for the end-of-task SVD
train:
  epochs_per_task: 20
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  amp: true               # fp16 mixed precision: big speedup on T4/RTX tensor cores
  amp_dtype: float16
  phase_stability_start: 0.35
  phase_stability_min: 0.75
  phase_stability_max: 1.0
alignment:
  enabled: true
  adaptive_gate: true
  lambda_bi: 8.0
  lambda_cyc: 2.0
  anti_collapse_weight: 0.0
  distribution_metric: symmetric_diagonal_gaussian_kl
  distribution_temperature: 1.0
  lambda_min: 0.4
  lambda_max: 1.0
  alignment_lr: 0.001
keeplora:
  weight_energy: 0.95
  feature_energy: 0.95
  gradient_init_loss: classification_only
  merge_after_task: false
  adapter_strategy: routed_multi_adapter
  router_similarity: l2
  router_temperature: 1.0
  router_top_k: 2
classifier:
  covariance_mode: full_shared
  shrinkage: 0.0001
