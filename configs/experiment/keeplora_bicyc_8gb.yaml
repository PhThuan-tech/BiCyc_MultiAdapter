name: keeplora_bicyc_8gb
# Full proposed method tuned for an 8 GB laptop GPU (e.g. RTX 4060 Laptop):
# smaller batch and activation cache so backbone + old snapshot + BiCyc fit in VRAM.
method: keeplora_bicyc
seed: 2024
trainer: keeplora
resume: true                 # tá»± Ä‘á»™ng tiáº¿p tá»¥c tá»« checkpoint trong output_dir náº¿u cÃ³
checkpoint_every_epochs: 1   # GPU cloud hay háº¿t thá»i gian: lÆ°u má»—i epoch (file ~350MB, ghi Ä‘Ã¨)
defaults:
  - /model: keeplora
  - /data: cifar100_10tasks
  - _self_
image_size: 224
targets: [qkv, proj, fc1, fc2]
activation_cache_rows: 1536  # ~220 MB CPU RAM per layer budget for the end-of-task SVD
train:
  epochs_per_task: 20
  batch_size: 32
  lr: 0.001
  weight_decay: 0.0001
  amp: true               # fp16 giÃºp GPU 8 GB (RTX 4060...) nhanh hÆ¡n Ä‘Ã¡ng ká»ƒ
  amp_dtype: float16
alignment:
  enabled: true
  adaptive_gate: true
  lambda_bi: 5.0
  lambda_cyc: 1.0
  anti_collapse_weight: 0.0
  distribution_metric: symmetric_diagonal_gaussian_kl
  distribution_temperature: 1.0
  lambda_min: 0.1
  lambda_max: 1.0
  alignment_lr: 0.001
keeplora:
  weight_energy: 0.95
  feature_energy: 0.95
  gradient_init_loss: classification_only
  merge_after_task: false
  adapter_strategy: routed_multi_adapter
  router_similarity: l2
  router_temperature: 1.0
  router_top_k: 3
classifier:
  covariance_mode: full_shared
  shrinkage: 0.0001
