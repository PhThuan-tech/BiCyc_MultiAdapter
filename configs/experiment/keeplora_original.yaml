name: keeplora_original
# Ablation 1 baseline: original KeepLoRA (merge after every task, no BiCyc).
# The A/D maps are still trained on detached features so old Gaussian class
# statistics can be transported; no alignment term ever touches B.
method: keeplora_original
seed: 2024
trainer: keeplora
resume: true                 # tự động tiếp tục từ checkpoint trong output_dir nếu có
checkpoint_every_epochs: 0   # >0: lưu snapshot giữa task mỗi N epoch (khuyến nghị trên cloud)
keep_task_checkpoints: false # true: giữ riêng checkpoint_task_<t>.pt sau mỗi task (tốn ~350MB/task)
defaults:
  - /model: keeplora
  - /data: cifar100_10tasks
  - _self_
image_size: 224
targets: [qkv, proj, fc1, fc2]
activation_cache_rows: 4096
train:
  epochs_per_task: 20
  batch_size: 128
  lr: 0.001
  weight_decay: 0.0001
  amp: false              # fp16 mixed precision; bật true trên GPU TensorCore (T4/RTX/A100)
  amp_dtype: float16
alignment:
  enabled: false
  adaptive_gate: false
  lambda_bi: 5.0
  lambda_cyc: 1.0
  anti_collapse_weight: 0.0
  distribution_metric: symmetric_diagonal_gaussian_kl
  distribution_temperature: 1.0
  lambda_min: 0.1
  lambda_max: 1.0
  alignment_lr: 0.001
keeplora:
  weight_energy: 0.95
  feature_energy: 0.95
  gradient_init_loss: classification_only
  merge_after_task: true
  adapter_strategy: merge
  router_similarity: l2
  router_temperature: 1.0
  router_top_k: null
classifier:
  covariance_mode: full_shared
  shrinkage: 0.0001