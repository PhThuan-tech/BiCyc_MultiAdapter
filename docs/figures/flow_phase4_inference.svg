<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="grad-header-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="grad-router-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="grad-mahal-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="grad-softmax-trapez" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="grad-contour" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#15803d" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="shadow-card-4" x="-3%" y="-3%" width="106%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <!-- Markers -->
    <marker id="arr-slate-4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#64748b"/>
    </marker>
    <marker id="arr-orange-4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#ea580c"/>
    </marker>
    <marker id="arr-green-4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#16a34a"/>
    </marker>
    <marker id="arr-blue-4" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="12" y="12" width="936" height="526" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card-4)"/>

  <!-- Header Banner -->
  <path d="M 12 28 Q 12 12 28 12 L 932 12 Q 948 12 948 28 L 948 64 L 12 64 Z" fill="url(#grad-header-4)"/>
  <text x="36" y="38" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="0.1em">PHASE 4 ARCHITECTURE • ZERO-HINT TESTING &amp; INFERENCE</text>
  <text x="36" y="56" fill="#ffffff" font-size="15" font-weight="700">PFD Multi-Adapter Routing (Cosine Top-1) &amp; Bayesian Mahalanobis Classification</text>
  <rect x="735" y="24" width="195" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
  <text x="832" y="42" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">Task-ID = None (Zero-Hint)</text>

  <!-- ================= TOP LEFT: DECISION PIPELINE ================= -->
  <g transform="translate(32, 80)">
    <rect width="600" height="215" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="18" y="22" fill="#334155" font-size="11.5" font-weight="700">Two-Stage Decision: Query Input ➔ PFD Top-1 Routing ➔ Mahalanobis Bayes</text>

    <!-- Query Input Sample Capsule (Zero-Hint) -->
    <g transform="translate(18, 40)">
      <rect width="90" height="155" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="45" y="24" fill="#0f172a" font-size="11" font-weight="800" text-anchor="middle">Test Query</text>

      <!-- Unknown test image (Tiger sample) -->
      <circle cx="45" cy="62" r="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
      <text x="45" y="69" font-size="22" text-anchor="middle">🐯</text>

      <rect x="8" y="96" width="74" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
      <text x="45" y="111" fill="#991b1b" font-size="8.5" font-weight="800" text-anchor="middle">Zero-Hint</text>

      <text x="45" y="132" fill="#64748b" font-size="8" text-anchor="middle"><tspan font-style="italic">x</tspan><tspan font-size="75%" dy="2">test</tspan><tspan dy="-2"> ∈ ℝ</tspan><tspan font-size="75%" dy="-4">3×224²</tspan><tspan dy="4"></tspan></text>
      <text x="45" y="144" fill="#dc2626" font-size="7.5" font-weight="700" text-anchor="middle">No Task-ID!</text>
    </g>

    <!-- Arrow Input -> Frozen ViT -->
    <path d="M 109 118 L 132 118" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr-slate-4)"/>

    <!-- Frozen ViT Feature Extraction Box -->
    <g transform="translate(136, 40)">
      <rect width="130" height="155" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
      <rect x="8" y="8" width="114" height="24" rx="5" fill="#334155"/>
      <text x="65" y="24" fill="#ffffff" font-size="10.5" font-weight="800" text-anchor="middle">ViT Backbone ❄️</text>

      <text x="10" y="48" fill="#475569" font-size="9">• 12 Transformer Blocks</text>
      <text x="10" y="62" fill="#475569" font-size="9">• Trích xuất token hˡ(x)</text>

      <!-- Query Vector q^l -->
      <rect x="8" y="74" width="114" height="34" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="65" y="90" fill="#0f172a" font-size="10" font-weight="800" text-anchor="middle">Query: <tspan font-style="italic">q</tspan>ˡ = <tspan font-style="italic">W</tspan>ˡ <tspan font-style="italic">h</tspan>ˡ</text>
      <text x="65" y="102" fill="#64748b" font-size="8" text-anchor="middle">Vector truy vấn Router</text>

      <!-- Base Feature W0 h -->
      <rect x="8" y="114" width="114" height="32" rx="5" fill="#e0f2fe" stroke="#0284c7"/>
      <text x="65" y="130" fill="#0369a1" font-size="10" font-weight="700" text-anchor="middle">Base: <tspan font-style="italic">W</tspan><tspan font-size="75%" dy="2">0</tspan><tspan dy="-2"> </tspan><tspan font-style="italic">h</tspan>(<tspan font-style="italic">x</tspan>)</text>
      <text x="65" y="141" fill="#0284c7" font-size="8" text-anchor="middle">No adapter added yet</text>
    </g>

    <!-- Arrow ViT -> PFD Router -->
    <path d="M 267 118 L 290 118" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arr-orange-4)"/>

    <!-- PFD Router Box (Stage 1) -->
    <g transform="translate(294, 40)">
      <rect width="145" height="155" rx="10" fill="url(#grad-router-box)" stroke="#f59e0b" stroke-width="1.3"/>
      <rect x="8" y="8" width="129" height="24" rx="5" fill="#d97706"/>
      <text x="72" y="24" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">Cấp 1: PFD Router</text>

      <!-- Prototype matching visual -->
      <text x="8" y="48" fill="#78350f" font-size="8.5" font-weight="700">Cosine Prototype Match:</text>
      <rect x="8" y="54" width="129" height="24" rx="4" fill="#ffffff" stroke="#fde68a"/>
      <text x="72" y="70" fill="#b45309" font-size="9" font-family="'Times New Roman', serif" font-weight="700" text-anchor="middle">cos(<tspan font-style="italic">q</tspan>ˡ, <tspan font-style="italic">D</tspan><tspan font-size="75%" dy="2"><tspan font-style="italic">j</tspan></tspan><tspan dy="-2">ˡ) / </tspan><tspan font-style="italic">T</tspan> (<tspan font-style="italic">T</tspan>=0.1)</text>

      <!-- Softmax routing bars -->
      <text x="8" y="92" fill="#475569" font-size="8">Task Weights <tspan font-style="italic">w</tspan><tspan font-size="75%" dy="2"><tspan font-style="italic">j</tspan></tspan><tspan dy="-2">:</tspan></text>
      <rect x="8" y="96" width="129" height="12" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="8" y="96" width="15" height="12" fill="#94a3b8"/>
      <rect x="25" y="96" width="95" height="12" fill="#ea580c"/>
      <rect x="122" y="96" width="15" height="12" fill="#94a3b8"/>

      <!-- Hard Top-1 selected adapter -->
      <rect x="8" y="115" width="129" height="32" rx="5" fill="#ecfdf5" stroke="#10b981"/>
      <text x="72" y="130" fill="#065f46" font-size="9.5" font-weight="800" text-anchor="middle">Top-1 Adapter: j* = 1 🔥</text>
      <text x="72" y="142" fill="#047857" font-size="8" text-anchor="middle">Kích hoạt Adapter Task 1</text>
    </g>

    <!-- Arrow Router -> Bayes Classifier -->
    <path d="M 440 118 L 464 118" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green-4)"/>

    <!-- Bayesian Mahalanobis Classifier Box (Stage 2) -->
    <g transform="translate(468, 40)">
      <rect width="120" height="155" rx="10" fill="url(#grad-mahal-box)" stroke="#16a34a" stroke-width="1.3"/>
      <rect x="6" y="8" width="108" height="24" rx="5" fill="#15803d"/>
      <text x="60" y="24" fill="#ffffff" font-size="9.5" font-weight="800" text-anchor="middle">Cấp 2: Bayes Score</text>

      <text x="8" y="48" fill="#166534" font-size="8.5" font-weight="700">So khớp toàn bộ:</text>
      <text x="8" y="60" fill="#15803d" font-size="8"><tspan font-style="italic">c</tspan> ∈ <tspan font-style="italic">C</tspan><tspan font-size="75%" dy="2">seen</tspan><tspan dy="-2"> (0..<tspan font-style="italic">T</tspan>−1)</tspan></text>

      <rect x="6" y="68" width="108" height="40" rx="4" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="60" y="84" fill="#065f46" font-size="9" font-family="'Times New Roman', serif" font-weight="700" text-anchor="middle"><tspan font-style="italic">S</tspan>(<tspan font-style="italic">z</tspan>, <tspan font-style="italic">c</tspan>) = Log-Likelihood</text>
      <text x="60" y="98" fill="#047857" font-size="8" text-anchor="middle">Mahalanobis Distance</text>

      <!-- Prediction Output -->
      <rect x="6" y="115" width="108" height="32" rx="5" fill="#0f172a"/>
      <text x="60" y="130" fill="#38bdf8" font-size="9" font-weight="800" text-anchor="middle">DỰ ĐOÁN ŷ:</text>
      <text x="60" y="142" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">Lớp: "Tiger" 🐯</text>
    </g>
  </g>

  <!-- ================= BOTTOM LEFT: FEATURE SPACE MAHALANOBIS CONTOURS ================= -->
  <g transform="translate(32, 310)">
    <rect width="600" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="18" y="20" fill="#0f172a" font-size="11.5" font-weight="800">Không Gian Đặc Trưng: Đường Đồng Mức Khoảng Cách Mahalanobis (μ<tspan font-size="75%" dy="2">c</tspan><tspan dy="-2">, Σ</tspan><tspan font-size="75%" dy="2">c</tspan><tspan dy="-2">)</tspan></text>

    <g transform="translate(18, 30)">
      <rect width="564" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>

      <!-- Class A (Old task transported) -->
      <g transform="translate(60, 68)">
        <!-- Outer Mahalanobis Ellipse contour 2 sigma -->
        <ellipse cx="0" cy="0" rx="55" ry="32" fill="none" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3 2"/>
        <!-- Inner Mahalanobis Ellipse contour 1 sigma -->
        <ellipse cx="0" cy="0" rx="38" ry="22" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.3"/>
        <!-- Center Mean Star -->
        <polygon points="0,-6 2,-1 7,0 3,3 4,8 0,5 -4,8 -3,3 -7,0 -2,-1" fill="#1d4ed8"/>
        <text x="0" y="16" fill="#1e40af" font-size="8.5" font-weight="700" text-anchor="middle">μ<tspan font-size="75%" dy="2">c1</tspan><tspan dy="-2"> (Cá Vàng)</tspan></text>
      </g>

      <!-- Class B (Current task target class: Tiger) -->
      <g transform="translate(250, 65)">
        <!-- Outer contour 3 sigma -->
        <ellipse cx="0" cy="0" rx="75" ry="42" fill="none" stroke="#86efac" stroke-width="1" stroke-dasharray="4 2"/>
        <!-- Middle contour 2 sigma -->
        <ellipse cx="0" cy="0" rx="52" ry="28" fill="none" stroke="#4ade80" stroke-width="1.2"/>
        <!-- Inner contour 1 sigma -->
        <ellipse cx="0" cy="0" rx="35" ry="18" fill="url(#grad-contour)" stroke="#16a34a" stroke-width="1.5"/>
        <!-- Center Mean Star -->
        <polygon points="0,-7 2,-2 8,0 3,4 5,10 0,6 -5,10 -3,4 -8,0 -2,-2" fill="#15803d"/>
        <text x="0" y="16" fill="#14532d" font-size="9" font-weight="800" text-anchor="middle">μ<tspan font-size="75%" dy="2">c2</tspan><tspan dy="-2"> (Hổ) 🎯</tspan></text>

        <!-- Test Query Point z inside Tiger contour -->
        <circle cx="15" cy="-6" r="4" fill="#ea580c" stroke="#ffffff" stroke-width="1.5"/>
        <text x="26" y="-6" fill="#c2410c" font-size="8.5" font-weight="800"><tspan font-style="italic">z</tspan> (Query)</text>
        <line x1="0" y1="0" x2="15" y2="-6" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="2 2"/>
        <text x="7" y="-12" fill="#ea580c" font-size="7" font-weight="700"><tspan font-style="italic">d</tspan><tspan font-size="75%" dy="2">M</tspan><tspan dy="-2"> cực tiểu!</tspan></text>
      </g>

      <!-- Class C (Frog) -->
      <g transform="translate(440, 72)">
        <ellipse cx="0" cy="0" rx="50" ry="28" fill="none" stroke="#fed7aa" stroke-width="1" stroke-dasharray="3 2"/>
        <ellipse cx="0" cy="0" rx="32" ry="18" fill="#ffedd5" stroke="#f97316" stroke-width="1.3"/>
        <polygon points="0,-6 2,-1 7,0 3,3 4,8 0,5 -4,8 -3,3 -7,0 -2,-1" fill="#c2410c"/>
        <text x="0" y="16" fill="#9a3412" font-size="8.5" font-weight="700" text-anchor="middle">μ<tspan font-size="75%" dy="2">c3</tspan><tspan dy="-2"> (Ếch)</tspan></text>
      </g>
    </g>

    <!-- Bottom summary banner -->
    <rect x="18" y="172" width="564" height="28" rx="6" fill="#ecfdf5" stroke="#bbf7d0"/>
    <text x="300" y="190" fill="#065f46" font-size="9.5" font-weight="700" text-anchor="middle">✓ Phân loại Mahalanobis đo độ biến thiên hiệp phương sai Σ<tspan font-size="75%" dy="2">c</tspan><tspan dy="-2"> ➔</tspan> Hoàn toàn miễn nhiễm thiên vị lớp mới (Zero Recency Bias)</text>
  </g>

  <!-- ================= RIGHT PANEL: COSINE ROUTER DETAIL ================= -->
  <g transform="translate(650, 80)">
    <!-- Container Box -->
    <rect width="278" height="440" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <path d="M 0 14 Q 0 0 14 0 L 264 0 Q 278 0 278 14 L 278 38 L 0 38 Z" fill="#ea580c"/>
    <text x="139" y="24" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">PFD Cosine Router Detail</text>

    <!-- Top Output: Selected Adapter Matrix -->
    <rect x="49" y="55" width="180" height="32" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
    <text x="139" y="75" fill="#c2410c" font-size="11.5" font-weight="800" text-anchor="middle">Selected: Adapter j* 🔥</text>
    <text x="139" y="100" fill="#7c2d12" font-size="9" text-anchor="middle">Hard Routing Top-1 (Không pha loãng)</text>

    <!-- Layer 4: Argmax Top-1 Gate -->
    <rect x="69" y="112" width="140" height="28" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="1.2"/>
    <text x="139" y="130" fill="#9a3412" font-size="10.5" font-weight="800" text-anchor="middle">ArgMax(<tspan font-style="italic">w</tspan><tspan font-size="75%" dy="2">1</tspan><tspan dy="-2">, ..., </tspan><tspan font-style="italic">w</tspan><tspan font-size="75%" dy="2">T</tspan><tspan dy="-2">)</tspan></text>
    <path d="M 139 112 L 139 88" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange-4)"/>

    <!-- Layer 3: Softmax Scaling with Temperature T = 0.1 -->
    <polygon points="89,205 189,205 219,155 59,155" fill="url(#grad-softmax-trapez)" stroke="#ea580c" stroke-width="1.5"/>
    <text x="139" y="178" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">Softmax(Φ / T)</text>
    <text x="139" y="192" fill="#fff7ed" font-size="8.5" text-anchor="middle">Temperature T = 0.1 (Peak Selection)</text>
    <path d="M 139 155 L 139 141" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arr-orange-4)"/>

    <!-- Layer 2: Cosine Similarity Matching Matrix -->
    <rect x="59" y="222" width="160" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="139" y="238" fill="#334155" font-size="10" font-weight="700" text-anchor="middle">Φ<tspan font-size="75%" dy="2"><tspan font-style="italic">j</tspan></tspan><tspan dy="-2"> = cos(</tspan><tspan font-style="italic">q</tspan>ˡ, <tspan font-style="italic">D</tspan><tspan font-size="75%" dy="2"><tspan font-style="italic">j</tspan></tspan><tspan dy="-2">ˡ)</tspan></text>
    <text x="139" y="254" fill="#64748b" font-size="8.5" text-anchor="middle"><tspan font-style="italic">q</tspan>ˡ · <tspan font-style="italic">D</tspan><tspan font-size="75%" dy="2"><tspan font-style="italic">j</tspan></tspan><tspan dy="-2">ˡ / (‖</tspan><tspan font-style="italic">q</tspan>ˡ‖ ‖<tspan font-style="italic">D</tspan><tspan font-size="75%" dy="2"><tspan font-style="italic">j</tspan></tspan><tspan dy="-2">ˡ‖)</tspan></text>
    <path d="M 139 222 L 139 206" fill="none" stroke="#64748b" stroke-width="1.5"/>

    <!-- Layer 1: Inputs Fusion -->
    <g transform="translate(59, 280)">
      <rect width="75" height="34" rx="5" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="37" y="18" fill="#475569" font-size="9.5" font-weight="700" text-anchor="middle">Query qˡ</text>
      <text x="37" y="29" fill="#64748b" font-size="7.5" text-anchor="middle">Từ test input</text>

      <rect x="85" y="0" width="75" height="34" rx="5" fill="#fef3c7" stroke="#f59e0b"/>
      <text x="122" y="18" fill="#b45309" font-size="9.5" font-weight="700" text-anchor="middle">Prototype <tspan font-style="italic">D</tspan><tspan font-size="75%" dy="2"><tspan font-style="italic">j</tspan></tspan><tspan dy="-2">ˡ</tspan></text>
      <text x="122" y="29" fill="#78350f" font-size="7.5" text-anchor="middle">Từ PFD Bank</text>
    </g>
    <path d="M 139 280 L 139 265" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr-slate-4)"/>

    <!-- Router Rationale Card at bottom -->
    <rect x="14" y="332" width="250" height="92" rx="8" fill="#ffffff" stroke="#fde68a"/>
    <text x="24" y="350" fill="#b45309" font-size="10" font-weight="800">💡 Vì sao Router giải quyết EFCIL?</text>
    <text x="24" y="368" fill="#475569" font-size="8.5">• Không cần lưu giữ bộ nhớ ảnh mẫu</text>
    <text x="24" y="382" fill="#475569" font-size="8.5">• Router chỉ so sánh 1 vector prototype</text>
    <text x="24" y="396" fill="#475569" font-size="8.5">• Kích hoạt đúng Adapter chuyên biệt</text>
    <text x="24" y="412" fill="#047857" font-size="8.5" font-weight="700">➔ Độ chính xác tiệm cận Joint-Training!</text>
  </g>
</svg>